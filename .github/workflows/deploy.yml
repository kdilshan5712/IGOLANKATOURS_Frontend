name: 🎨 Frontend CI/CD — igolankatours.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME: acrigolankaprod
  ACR_URL: acrigolankaprod.azurecr.io
  IMAGE_NAME: igolanka-frontend
  CONTAINER_APP_NAME: web-frontend
  RESOURCE_GROUP: rg-igolanka-central

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1: Lint & Build Check
  # ──────────────────────────────────────────────────────────────────
  lint-and-build:
    name: 🔍 Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true

      - name: Build Vite production bundle (validation)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # ──────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker Image & Push to ACR (main branch only)
  # ──────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_URL }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Azure Container Apps → www.igolankatours.com
  # ──────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to www.igolankatours.com
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ env.ACR_NAME }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Verify www.igolankatours.com is live
        run: |
          echo "Waiting 30s for container to start..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.igolankatours.com)
          echo "HTTP status: $STATUS"
          if [[ "$STATUS" != "200" && "$STATUS" != "301" && "$STATUS" != "302" ]]; then
            echo "❌ www.igolankatours.com returned $STATUS — deployment may have failed!"
            exit 1
          fi
          echo "✅ www.igolankatours.com is live!"

      - name: Post deployment summary
        if: always()
        run: |
          echo "### 🎨 Frontend Deployment to www.igolankatours.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container App:** \`${{ env.CONTAINER_APP_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Production URL:** https://www.igolankatours.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
